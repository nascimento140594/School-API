<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School API</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .hero{
            padding:80px 0;
        }

        .card{
            border:none;
            border-radius:18px;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-6px);
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        footer{
            margin-top:80px;
            color:#888;
        }

    </style>

</head>

<body>

<div class="container hero">

<div class="text-center">

<h1 class="display-3 fw-bold">
🎓 School API
</h1>

<p class="lead mt-3">

REST API built with Django REST Framework

</p>

<p>

Manage teachers, students, courses,
enrollments and grades.

</p>

</div>

<div class="row mt-5 g-4">

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h3>👨‍🏫</h3>

<h4>Teachers</h4>

<a href="/api/teachers/" class="btn btn-primary mt-3">

Open

</a>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h3>👨‍🎓</h3>

<h4>Students</h4>

<a href="/api/students/" class="btn btn-success mt-3">

Open

</a>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h3>📚</h3>

<h4>Courses</h4>

<a href="/api/courses/" class="btn btn-warning mt-3">

Open

</a>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card shadow">

<div class="card-body text-center">

<h3>📝</h3>

<h4>Enrollments</h4>

<a href="/api/enrollments/" class="btn btn-info mt-3">

Open

</a>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card shadow">

<div class="card-body text-center">

<h3>🏆</h3>

<h4>Grades</h4>

<a href="/api/grades/" class="btn btn-danger mt-3">

Open

</a>

</div>

</div>

</div>

</div>

<div class="text-center mt-5">

<a href="/api/" class="btn btn-dark btn-lg">

API Root

</a>

<a href="/api/doc/swagger/" class="btn btn-primary btn-lg">

Swagger

</a>

<a href="/admin/" class="btn btn-secondary btn-lg">

Admin

</a>

</div>

<footer class="text-center">

<hr>

<p>

School API • Django REST Framework • Version 1.0.0

</p>

</footer>

</div>

</body>
</html>
